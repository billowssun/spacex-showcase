<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Starship launch site illustration</title>
  <desc id="desc">A cinematic launch site scene with a large stainless steel rocket, tower, stars, and horizon glow.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset=".52" stop-color="#111a2c"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".58" cy=".78" r=".45">
